{% extends "includes/base.html" %}
{% load static %}
{% block content %}

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <div class="col-sm-12">
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <a href="{% url 'officer_view_announcement' %}" class="btn btn-secondary" title="Go Back">
                            <i class="fas fa-arrow-left"></i>&nbsp;&nbsp; Back
                        </a>
                        <div class="text-center flex-grow-1">
                            <h1 class="h3 mb-0 text-gray-800">Add Announcement</h1>
                        </div>
                    </div>
                </div>

                <form method="post" action="{% url 'officer_add_announcement' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% include 'includes/messages.html' %}

                    <div class="col-sm-11">
                        <label for="announcement_title">Title</label>
                        <input type="text" class="form-control text-uppercase" name="announcement_title" placeholder="Enter Announcement Title" />
                    </div><br>

                    <div class="col-sm-11">
                        <label for="announcement_description">Description</label>
                        <input type="text" class="form-control text-uppercase" id="announcement_description" name="announcement_description" placeholder="Enter Announcement Description" />
                    </div><br>

                    <div class="col-sm-11">
                        <label for="announcement_banner">Banner</label>
                        <input type="file" class="form-control" id="announcement_banner" name="announcement_banner" accept="image/*" onchange="previewImage(event)" />
                        <small class="text-muted">Save path: <code>media/announcementbanner/</code></small>
                    </div>
                    <div class="col-sm-11 mt-1">
                        <input type="text" id="file_path_display" class="form-control form-control-sm" readonly placeholder="No file selected" style="background:#f8f9fa;color:#6c757d;" />
                    </div>
                    <div class="col-sm-11">
                        <img id="image_preview" src="#" alt="Image Preview" style="width:192px;height:192px;object-fit:cover;margin-top:10px;border:2px solid gray;border-radius:4px;display:none;" />
                    </div><br>

                    <div class="col-sm-11">
                        <label for="announcement_tags">Tags (comma-separated):</label>
                        <input type="text" id="announcement_tags" name="announcement_tags" placeholder="Enter tags, separated by commas">
                    </div><br>

                    <div class="col-sm-11">
                        <label for="announcement_status">Publish it Now?</label>
                        <select class="form-control" id="announcement_status" name="announcement_status">
                            <option value="True">YES</option>
                            <option value="False">NO</option>
                        </select>
                    </div>

                    <div class="col-sm mt-3">
                        <button type="submit" class="btn btn-primary">Add Announcement</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function previewImage(event) {
    const imagePreview = document.getElementById('image_preview');
    const filePathDisplay = document.getElementById('file_path_display');
    const file = event.target.files[0];
    if (file) {
        filePathDisplay.value = 'media/announcementbanner/' + file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        filePathDisplay.value = '';
        imagePreview.src = '#';
        imagePreview.style.display = 'none';
    }
}
</script>
{% endblock %}
