{% extends "includes/base.html" %}
{% load static %}
{% block content %}

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <a href="{% url 'officer_view_invoice' %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i>&nbsp;&nbsp; Back
                    </a>
                    <div class="text-center flex-grow-1">
                        <h1 class="h3 mb-0 text-gray-800">Edit Invoice</h1>
                    </div>
                </div>

                {% include 'includes/messages.html' %}

                <form method="post" action="{% url 'officer_update_invoice' %}">
                    {% csrf_token %}
                    <input type="hidden" name="invoice_id" value="{{ invoice.id }}">

                    <div class="form-group col-sm-6">
                        <label>Invoice No.</label>
                        <input type="text" class="form-control" name="invoice_no" value="{{ invoice.invoice_no }}" required>
                    </div>

                    <div class="form-group col-sm-6">
                        <label>Name</label>
                        <input type="text" class="form-control" name="name" value="{{ invoice.name }}" required>
                    </div>

                    <div class="form-group col-sm-6">
                        <label>Institution</label>
                        <input type="text" class="form-control" name="institution" value="{{ invoice.institution }}" required>
                    </div>

                    <div class="form-group col-sm-6">
                        <label>Payment</label>
                        <input type="text" class="form-control" name="payment" value="{{ invoice.payment }}" placeholder="Ex Event Title" required>
                    </div>

                    <div class="form-group col-sm-6">
                        <label>Amount Paid</label>
                        <input type="number" class="form-control" name="amt_paid" value="{{ invoice.amt_paid }}" required min="0">
                    </div>

                    <div class="form-group col-sm-6">
                        <label>Date</label>
                        <input type="datetime-local" class="form-control" name="created_at"
                            value="{{ invoice.created_at|date:'Y-m-d' }}T{{ invoice.created_at|time:'H:i'|default:'' }}">
                    </div>

                    <div class="col-sm mt-3">
                        <button type="submit" class="btn btn-primary">Update Invoice</button>
                        <a href="{% url 'officer_view_invoice' %}" class="btn btn-secondary ms-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
